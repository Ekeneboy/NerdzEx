<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NerdzEx — Search, refined</title>
<meta name="description" content="A fast, minimal, AI-assisted search homepage with mini apps." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Google Programmable Search Engine. parsetags:'explicit' lets us control
     exactly when the results element renders, so we can drive it from our
     own search bar instead of Google's default box. -->
<script>
  window.__gcse = {
    parsetags: 'explicit',
    callback: function(){ window.NerdzEx && window.NerdzEx.Search.onCseReady(); }
  };
</script>
<script async src="https://cse.google.com/cse.js?cx=d71e67710b9744b46"></script>

<style>
  :root{
    --bg-1:#E4E9FD;
    --bg-2:#ECE6FA;
    --ink:#1E2233;
    --ink-muted:#666C80;
    --ink-faint:#9599AB;
    --brand:#3A56D4;
    --brand-dark:#24399E;
    --brand-soft:rgba(58,86,212,0.08);
    --surface:#FFFFFF;
    --surface-border:rgba(30,34,51,0.08);
    --surface-shadow:0 10px 30px rgba(30,34,60,0.10), 0 2px 8px rgba(30,34,60,0.06);
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:10px;
    --font-display:'Sora', system-ui, sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
    color-scheme: light;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; }

  body{
    font-family:var(--font-body);
    color:var(--ink);
    min-height:100vh;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment:fixed;
    background-size:cover;
    background-position:center;
    transition:background 0.4s ease;
  }

  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .hidden{ display:none !important; }
  a, button{ font-family:inherit; }
  button{ cursor:pointer; border:none; background:none; color:inherit; }
  :focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:6px; }

  /* ---------- layout ---------- */
  .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 48px; }

  .topbar{ width:100%; max-width:640px; display:flex; justify-content:flex-end; gap:10px; }
  .icon-btn.round{
    width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(255,255,255,0.55); backdrop-filter:blur(8px);
    border:1px solid var(--surface-border); box-shadow:0 4px 14px rgba(30,34,60,0.08);
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .icon-btn.round:hover{ background:rgba(255,255,255,0.85); transform:translateY(-1px); }
  .icon-btn.round svg{ width:20px; height:20px; stroke:var(--ink); }

  .hero{ width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; gap:22px; padding-top:4vh; }

  /* ---------- logo ---------- */
  .logo{ margin:0; font-family:var(--font-display); font-weight:800; font-size:clamp(2.2rem, 7vw, 2.8rem); letter-spacing:-0.01em; display:flex; align-items:baseline; color:var(--ink); user-select:none; }
  .logo-n, .logo-e{ color:var(--brand); }
  .cursor{ display:inline-block; width:0.42em; margin-left:2px; color:var(--brand); animation:blink 1.1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  @media (prefers-reduced-motion:reduce){ .cursor{ animation:none; } }

  /* ---------- search bar + autocomplete ---------- */
  .search-wrap{ width:100%; position:relative; }
  .search-bar{
    width:100%; display:flex; align-items:center; gap:8px;
    background:var(--surface); border-radius:24px; padding:12px 10px 12px 20px;
    box-shadow:var(--surface-shadow); border:1px solid var(--surface-border); position:relative; z-index:2;
  }
  .search-bar.expanded{ border-radius:24px 24px 0 0; box-shadow:none; border-bottom-color:transparent; }
  .search-icon-btn{ display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .search-icon-btn svg{ width:20px; height:20px; stroke:var(--ink-muted); }
  #searchInput{ flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:1rem; color:var(--ink); padding:6px 0; }
  #searchInput::placeholder{ color:var(--ink-faint); }
  .icon-btn.subtle{ width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:50%; flex-shrink:0; transition:background 0.15s ease; }
  .icon-btn.subtle:hover{ background:var(--brand-soft); }
  .icon-btn.subtle svg{ width:18px; height:18px; stroke:var(--ink-muted); }
  .icon-btn.subtle[disabled]{ opacity:0.35; cursor:not-allowed; }
  .icon-btn.subtle[disabled]:hover{ background:none; }
  .icon-btn.subtle.listening svg{ stroke:#E14848; }

  .autocomplete-list{
    position:absolute; top:100%; left:0; right:0; z-index:1;
    background:var(--surface); border:1px solid var(--surface-border); border-top:none;
    border-radius:0 0 20px 20px; box-shadow:var(--surface-shadow); overflow:hidden; list-style:none; margin:0; padding:6px 0;
  }
  .ac-item{ display:flex; align-items:center; gap:12px; padding:9px 20px; cursor:pointer; }
  .ac-item svg{ width:15px; height:15px; stroke:var(--ink-faint); flex-shrink:0; }
  .ac-item span{ font-size:0.92rem; color:var(--ink); }
  .ac-item:hover, .ac-item.active{ background:var(--brand-soft); }

  /* ---------- trending ---------- */
  .trending{ width:100%; display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none; }
  .trending::-webkit-scrollbar{ display:none; }
  .trend-chip{ flex-shrink:0; display:flex; align-items:center; gap:6px; font-size:0.82rem; font-weight:500; color:var(--ink-muted); background:rgba(255,255,255,0.55); border:1px solid var(--surface-border); padding:7px 14px; border-radius:999px; }
  .trend-chip:hover{ background:rgba(255,255,255,0.9); color:var(--ink); }
  .trend-chip svg{ width:13px; height:13px; stroke:#E1893F; }

  /* ---------- AI summary card ---------- */
  .ai-card{ width:100%; background:var(--surface); border-radius:var(--radius-md); border:1px solid var(--surface-border); box-shadow:var(--surface-shadow); padding:16px 18px; border-left:3px solid var(--brand); }
  .ai-card-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .ai-card-head svg{ width:16px; height:16px; stroke:var(--brand); }
  .ai-card-head span{ font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--brand); }
  .ai-card-body{ font-size:0.92rem; line-height:1.55; color:var(--ink); }
  .ai-card-body.clamped{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .ai-card-more{ margin-top:8px; font-size:0.8rem; font-weight:600; color:var(--brand); }

  .skeleton-line{ height:12px; border-radius:6px; background:linear-gradient(90deg, #EEF0FA 25%, #F7F8FD 37%, #EEF0FA 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; margin-bottom:8px; }
  .skeleton-line:last-child{ width:70%; margin-bottom:0; }
  @keyframes shimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }
  @media (prefers-reduced-motion:reduce){ .skeleton-line{ animation:none; } }

  /* ---------- quick answer card ---------- */
  .qa-card{ width:100%; background:var(--surface); border-radius:var(--radius-md); border:1px solid var(--surface-border); box-shadow:var(--surface-shadow); padding:18px; text-align:center; }
  .qa-value{ font-family:var(--font-display); font-size:1.8rem; font-weight:700; color:var(--ink); }
  .qa-label{ font-size:0.78rem; color:var(--ink-faint); margin-top:4px; text-transform:uppercase; letter-spacing:0.04em; }
  .qa-detail{ font-size:0.85rem; color:var(--ink-muted); margin-top:10px; line-height:1.5; }

  /* ---------- results ---------- */
  .results-wrap{ width:100%; background:var(--surface); border-radius:var(--radius-md); border:1px solid var(--surface-border); box-shadow:var(--surface-shadow); padding:16px 18px; }
  .gcse-search{ font-family:var(--font-body); }

  /* ---------- recent searches ---------- */
  .recent{ width:100%; }
  .recent-header{ display:flex; align-items:center; justify-content:space-between; padding:0 6px 10px; }
  .recent-header h2{ margin:0; font-size:0.8rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-muted); }
  .text-btn{ font-size:0.8rem; font-weight:600; color:var(--brand); padding:4px 6px; border-radius:6px; }
  .text-btn:hover{ text-decoration:underline; }
  .recent-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .recent-item{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.6); backdrop-filter:blur(6px); border:1px solid var(--surface-border); border-radius:var(--radius-sm); padding:10px 12px; }
  .recent-item:hover{ background:rgba(255,255,255,0.9); }
  .recent-item svg.type-icon{ width:16px; height:16px; stroke:var(--ink-faint); flex-shrink:0; }
  .recent-main{ flex:1; min-width:0; display:flex; flex-direction:column; text-align:left; }
  .recent-main button{ text-align:left; font-size:0.92rem; color:var(--ink); background:none; padding:0; }
  .recent-time{ font-size:0.72rem; color:var(--ink-faint); }
  .recent-pin, .recent-remove{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .recent-pin:hover, .recent-remove:hover{ background:rgba(30,34,51,0.08); }
  .recent-pin svg, .recent-remove svg{ width:14px; height:14px; stroke:var(--ink-faint); }
  .recent-pin.pinned svg{ stroke:var(--brand); fill:var(--brand); }
  .recent-empty{ margin:4px 6px 0; font-size:0.85rem; color:var(--ink-faint); }

  /* ---------- modal panel (settings + mini apps share this base) ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(20,22,36,0.32); backdrop-filter:blur(2px); z-index:20; animation:fadeIn 0.2s ease; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .panel{ position:fixed; z-index:30; top:50%; left:50%; transform:translate(-50%,-50%); width:min(440px, 92vw); max-height:84vh; overflow-y:auto; background:var(--surface); border-radius:var(--radius-lg); box-shadow:0 25px 60px rgba(20,22,36,0.25); padding:8px 0 20px; animation:popIn 0.18s ease; }
  @keyframes popIn{ from{ opacity:0; transform:translate(-50%,-46%) scale(0.97); } to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
  .panel-handle{ display:none; }
  .panel-header{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px 10px; }
  .panel-header h2{ margin:0; font-family:var(--font-display); font-size:1.05rem; font-weight:700; }
  .panel-header .icon-btn{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .panel-header .icon-btn:hover{ background:rgba(30,34,51,0.06); }
  .panel-header .icon-btn svg{ width:16px; height:16px; stroke:var(--ink-muted); }
  .panel-body{ padding:4px 20px 0; display:flex; flex-direction:column; gap:8px; }
  @media (max-width:640px){
    .panel{ top:auto; bottom:0; left:0; transform:translateY(0); width:100%; max-width:none; border-radius:20px 20px 0 0; max-height:88vh; animation:slideUp 0.22s ease; padding-top:10px; }
    @keyframes slideUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
    .panel-handle{ display:block; width:36px; height:4px; border-radius:2px; background:var(--surface-border); margin:2px auto 6px; }
  }

  /* settings-specific */
  .panel-action{ width:100%; display:flex; align-items:center; gap:12px; text-align:left; padding:12px 14px; border-radius:var(--radius-md); background:var(--brand-soft); }
  .panel-action:hover{ background:rgba(58,86,212,0.1); }
  .panel-action svg{ width:18px; height:18px; stroke:var(--brand); flex-shrink:0; }
  .panel-action span{ font-size:0.9rem; font-weight:500; }
  .url-action{ background:var(--brand-soft); border-radius:var(--radius-md); padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .url-action label{ font-size:0.9rem; font-weight:500; display:flex; align-items:center; gap:10px; }
  .url-action label svg{ width:18px; height:18px; stroke:var(--brand); flex-shrink:0; }
  .url-row{ display:flex; gap:8px; }
  .url-row input{ flex:1; min-width:0; border:1px solid var(--surface-border); border-radius:var(--radius-sm); padding:8px 10px; font-size:0.85rem; outline:none; }
  .url-row input:focus{ border-color:var(--brand); }
  .url-row button{ background:var(--brand); color:#fff; font-size:0.85rem; font-weight:600; padding:8px 14px; border-radius:var(--radius-sm); flex-shrink:0; }
  .url-row button:hover{ background:var(--brand-dark); }
  .panel-section-label{ display:block; font-size:0.8rem; font-weight:600; color:var(--ink-muted); padding:6px 4px 10px; }
  .swatch-grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; }
  .swatch{ aspect-ratio:1; border-radius:10px; border:2px solid transparent; position:relative; }
  .swatch:hover{ transform:scale(1.08); }
  .swatch[aria-pressed="true"]{ border-color:var(--ink); }
  .swatch[aria-pressed="true"]::after{ content:''; position:absolute; inset:0; margin:auto; width:8px; height:8px; border-radius:50%; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,0.15); }

  /* mini apps hub */
  .panel.wide{ width:min(560px, 94vw); }
  .app-search{ display:flex; align-items:center; gap:8px; background:var(--brand-soft); border-radius:var(--radius-sm); padding:9px 12px; margin-bottom:4px; }
  .app-search svg{ width:16px; height:16px; stroke:var(--ink-muted); flex-shrink:0; }
  .app-search input{ flex:1; border:none; background:none; outline:none; font-size:0.9rem; }
  .app-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:6px; }
  @media (min-width:480px){ .app-grid{ grid-template-columns:repeat(4, 1fr); } }
  .app-tile{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 6px; border-radius:var(--radius-md); background:var(--brand-soft); position:relative; }
  .app-tile:hover{ background:rgba(58,86,212,0.12); }
  .app-tile .app-icon{ font-size:1.5rem; line-height:1; }
  .app-tile .app-name{ font-size:0.74rem; font-weight:600; color:var(--ink); text-align:center; }
  .app-fav{ position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .app-fav svg{ width:12px; height:12px; stroke:var(--ink-faint); }
  .app-fav.favorited svg{ stroke:#E1A83F; fill:#E1A83F; }
  .app-section-label{ font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin:14px 2px 2px; }
  .app-empty{ font-size:0.85rem; color:var(--ink-faint); padding:10px 4px; }

  .app-view{ display:flex; flex-direction:column; gap:14px; }
  .app-view-back{ display:flex; align-items:center; gap:6px; font-size:0.85rem; font-weight:600; color:var(--brand); align-self:flex-start; }
  .app-view-back svg{ width:15px; height:15px; stroke:var(--brand); }
  .app-field{ display:flex; flex-direction:column; gap:6px; }
  .app-field label{ font-size:0.8rem; font-weight:600; color:var(--ink-muted); }
  .app-field select, .app-field input[type="text"], .app-field input[type="number"]{ border:1px solid var(--surface-border); border-radius:var(--radius-sm); padding:9px 11px; font-size:0.92rem; outline:none; }
  .app-field select:focus, .app-field input:focus{ border-color:var(--brand); }
  .app-row{ display:flex; gap:10px; align-items:center; }
  .app-row > *{ flex:1; }
  .app-btn{ background:var(--brand); color:#fff; font-weight:600; font-size:0.9rem; padding:10px 16px; border-radius:var(--radius-sm); text-align:center; }
  .app-btn:hover{ background:var(--brand-dark); }
  .app-btn.ghost{ background:var(--brand-soft); color:var(--brand); }
  .app-btn.ghost:hover{ background:rgba(58,86,212,0.15); }
  .app-output{ background:var(--brand-soft); border-radius:var(--radius-md); padding:14px; font-family:var(--font-display); font-size:1.3rem; font-weight:700; text-align:center; color:var(--ink); word-break:break-all; }
  .app-output.small{ font-family:var(--font-body); font-size:0.95rem; font-weight:500; }

  .calc-display{ background:var(--ink); color:#fff; border-radius:var(--radius-md); padding:18px; text-align:right; font-family:var(--font-display); font-size:1.8rem; font-weight:700; overflow-x:auto; }
  .calc-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .calc-key{ background:var(--brand-soft); border-radius:var(--radius-sm); padding:14px 0; text-align:center; font-size:1.05rem; font-weight:600; }
  .calc-key:hover{ background:rgba(58,86,212,0.15); }
  .calc-key.op{ background:var(--brand); color:#fff; }
  .calc-key.op:hover{ background:var(--brand-dark); }

  .timer-display{ font-family:var(--font-display); font-size:2.6rem; font-weight:700; text-align:center; }
  .dice-face{ font-size:3.4rem; text-align:center; }

  footer.credit{ font-size:0.72rem; color:var(--ink-faint); padding-top:20px; text-align:center; }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <button id="miniAppsToggle" class="icon-btn round" aria-haspopup="dialog" aria-expanded="false" aria-controls="miniAppsPanel" aria-label="Open mini apps">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
    </button>
    <button id="settingsToggle" class="icon-btn round" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel" aria-label="Open background settings">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <main class="hero">
    <h1 class="logo"><span class="logo-n">N</span>erdz<span class="logo-e">E</span>x<span class="cursor" aria-hidden="true">_</span></h1>

    <div class="search-wrap">
      <form id="searchForm" class="search-bar" role="search" aria-label="Web search" autocomplete="off">
        <button type="submit" class="search-icon-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        </button>
        <label for="searchInput" class="sr-only">Search the web</label>
        <input id="searchInput" name="q" type="text" autocomplete="off" placeholder="Search the web, ask a question, or try a quick answer" role="combobox" aria-expanded="false" aria-controls="autocompleteList" aria-autocomplete="list" />
        <button type="button" id="micBtn" class="icon-btn subtle" aria-label="Search by voice">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
        </button>
        <button type="button" id="lensBtn" class="icon-btn subtle" aria-label="Search by image with Google Lens">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </button>
      </form>
      <ul id="autocompleteList" class="autocomplete-list hidden" role="listbox"></ul>
    </div>

    <div id="trending" class="trending" aria-label="Trending searches"></div>

    <div id="aiCard" class="ai-card hidden" aria-live="polite">
      <div class="ai-card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 0-5 5v1a3 3 0 0 0-2 2.83V16a3 3 0 0 0 3 3h1a5 5 0 0 0 10 0h1a3 3 0 0 0 3-3v-5.17A3 3 0 0 0 21 8V7a5 5 0 0 0-5-5"></path><circle cx="9" cy="12" r="0.7" fill="currentColor"></circle><circle cx="15" cy="12" r="0.7" fill="currentColor"></circle></svg>

<script>
/* =======================================================================
   NerdzEx — namespaced modules. Each module owns one concern so new
   features (more mini apps, a real AI backend, more quick-answer types)
   can be added without touching unrelated code.
   ======================================================================= */
window.NerdzEx = window.NerdzEx || {};

(function(NerdzEx){
  "use strict";

  /* ----------------------------------------------------------------- *
   *  Utilities
   * ----------------------------------------------------------------- */
  var $ = function(id){ return document.getElementById(id); };
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function relativeTime(ts){
    var diff = Math.round((Date.now() - ts) / 1000);
    if(diff < 60) return 'just now';
    if(diff < 3600) return Math.floor(diff/60) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    return Math.floor(diff/86400) + 'd ago';
  }

  /* ----------------------------------------------------------------- *
   *  Background module (unchanged behavior from v2.0)
   * ----------------------------------------------------------------- */
  NerdzEx.Background = (function(){
    var STORAGE_BG = 'nerdzex:background';
    var DEFAULT_GRADIENT = 'linear-gradient(160deg, #E4E9FD 0%, #ECE6FA 100%)';
    var swatches = [
      {hex:'#A5B4FC', name:'Periwinkle'}, {hex:'#93C5FD', name:'Sky'},
      {hex:'#7DD3C0', name:'Seafoam'}, {hex:'#86EFAC', name:'Mint'},
      {hex:'#FDE68A', name:'Butter'}, {hex:'#FDBA74', name:'Apricot'},
      {hex:'#FCA5A5', name:'Coral'}, {hex:'#F9A8D4', name:'Blossom'},
      {hex:'#D8B4FE', name:'Lilac'}, {hex:'#CBD5E1', name:'Fog'},
      {hex:'#3A56D4', name:'Brand blue'}, {hex:'#1E2233', name:'Ink'}
    ];
    var body = document.body;
    var swatchGrid = $('swatchGrid');

    function apply(state){
      if(state.type === 'color'){
        body.style.backgroundImage = 'none';
        body.style.backgroundColor = state.value;
      } else if(state.type === 'image' || state.type === 'imageUrl'){
        body.style.backgroundColor = 'transparent';
        body.style.backgroundImage = 'url("' + state.value + '")';
        body.style.backgroundSize = 'cover';
        body.style.backgroundPosition = 'center';
      } else {
        body.style.backgroundColor = 'transparent';
        body.style.backgroundImage = DEFAULT_GRADIENT;
      }
      markActive(state);
    }
    function save(state){
      try{ localStorage.setItem(STORAGE_BG, JSON.stringify(state)); }catch(e){}
      apply(state);
    }
    function load(){
      try{
        var raw = localStorage.getItem(STORAGE_BG);
        if(raw){ apply(JSON.parse(raw)); return; }
      }catch(e){}
      apply({type:'gradient'});
    }
    function markActive(state){
      var buttons = swatchGrid.querySelectorAll('.swatch');
      buttons.forEach(function(btn){
        var active = state.type === 'color' && btn.dataset.hex.toLowerCase() === (state.value||'').toLowerCase();
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }
    function buildSwatches(){
      swatches.forEach(function(s){
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'swatch'; btn.style.background = s.hex;
        btn.dataset.hex = s.hex; btn.setAttribute('aria-pressed','false'); btn.setAttribute('aria-label', s.name);
        btn.addEventListener('click', function(){ save({type:'color', value:s.hex}); });
        swatchGrid.appendChild(btn);
      });
    }
    function init(){
      buildSwatches(); load();
      $('resetGradient').addEventListener('click', function(){ save({type:'gradient'}); });
      $('uploadImageBtn').addEventListener('click', function(){ $('imageFileInput').click(); });
      $('imageFileInput').addEventListener('change', function(){
        var file = this.files && this.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(e){ save({type:'image', value:e.target.result}); NerdzEx.Panels.close(); };
        reader.readAsDataURL(file);
      });
      $('applyUrlBtn').addEventListener('click', function(){
        var url = $('imageUrlInput').value.trim();
        if(!url) return;
        save({type:'imageUrl', value:url}); NerdzEx.Panels.close();
      });
    }
    return { init:init };
  })();

  /* ----------------------------------------------------------------- *
   *  Panels module — shared open/close/focus behavior for the
   *  settings panel and the mini apps panel.
   * ----------------------------------------------------------------- */
  NerdzEx.Panels = (function(){
    var overlay = $('overlay');
    var activePanel = null;
    var lastFocused = null;

    function open(panel, toggleBtn){
      close();
      activePanel = panel;
      lastFocused = document.activeElement;
      panel.classList.remove('hidden');
      overlay.classList.remove('hidden');
      if(toggleBtn) toggleBtn.setAttribute('aria-expanded','true');
      var closeBtn = panel.querySelector('.panel-close');
      if(closeBtn) closeBtn.focus();
      document.addEventListener('keydown', onKeydown);
    }
    function close(){
      if(!activePanel) return;
      activePanel.classList.add('hidden');
      overlay.classList.add('hidden');
      document.querySelectorAll('.topbar .icon-btn').forEach(function(b){ b.setAttribute('aria-expanded','false'); });
      document.removeEventListener('keydown', onKeydown);
      if(lastFocused) lastFocused.focus();
      activePanel = null;
    }
    function onKeydown(e){ if(e.key === 'Escape') close(); }

    function init(){
      overlay.addEventListener('click', close);
      document.querySelectorAll('.panel-close').forEach(function(btn){
        btn.addEventListener('click', close);
      });
      $('settingsToggle').addEventListener('click', function(){ open($('settingsPanel'), this); });
      $('miniAppsToggle').addEventListener('click', function(){ open($('miniAppsPanel'), this); NerdzEx.MiniApps.renderHome(); });
    }
    return { init:init, open:open, close:close };
  })();

  /* ----------------------------------------------------------------- *
   *  History module — recent searches with timestamp, pin, delete
   * ----------------------------------------------------------------- */
  NerdzEx.History = (function(){
    var STORAGE_RECENT = 'nerdzex:recent';
    var MAX_RECENT = 12;
    var recentList = $('recentList');
    var recentEmpty = $('recentEmpty');
    var clearRecentBtn = $('clearRecent');

    function load(){
      try{ var raw = localStorage.getItem(STORAGE_RECENT); return raw ? JSON.parse(raw) : []; }
      catch(e){ return []; }
    }
    function save(list){ try{ localStorage.setItem(STORAGE_RECENT, JSON.stringify(list)); }catch(e){} }

    function sorted(list){
      return list.slice().sort(function(a,b){
        if(!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
        return b.ts - a.ts;
      });
    }

    function render(){
      var list = sorted(load());
      recentList.innerHTML = '';
      if(list.length === 0){
        recentEmpty.classList.remove('hidden');
        clearRecentBtn.classList.add('hidden');
        return;
      }
      recentEmpty.classList.add('hidden');
      clearRecentBtn.classList.remove('hidden');

      list.forEach(function(item){
        var li = document.createElement('li');
        li.className = 'recent-item';

        li.innerHTML =
          '<svg class="type-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>' +
          '<div class="recent-main"><button type="button" class="recent-query"></button><span class="recent-time"></span></div>' +
          '<button type="button" class="recent-pin' + (item.pinned ? ' pinned' : '') + '" aria-label="' + (item.pinned ? 'Unpin' : 'Pin') + ' search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.5 5.5L19 9l-4 3.5L16 18l-4-3-4 3 1-5.5L5 9l5.5-1.5z"></path></svg></button>' +
          '<button type="button" class="recent-remove" aria-label="Remove search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>';

        li.querySelector('.recent-query').textContent = item.q;
        li.querySelector('.recent-time').textContent = relativeTime(item.ts);

        li.querySelector('.recent-query').addEventListener('click', function(){
          $('searchInput').value = item.q;
          NerdzEx.Search.run(item.q);
        });
        li.querySelector('.recent-pin').addEventListener('click', function(){
          var all = load();
          var found = all.find(function(x){ return x.q === item.q; });
          if(found) found.pinned = !found.pinned;
          save(all); render();
        });
        li.querySelector('.recent-remove').addEventListener('click', function(){
          save(load().filter(function(x){ return x.q !== item.q; }));
          render();
        });

        recentList.appendChild(li);
      });
    }

    function add(query){
      var list = load().filter(function(x){ return x.q.toLowerCase() !== query.toLowerCase(); });
      list.unshift({ q: query, ts: Date.now(), pinned:false });
      if(list.length > MAX_RECENT) list = list.slice(0, MAX_RECENT);
      save(list); render();
    }

    function all(){ return load(); }

    function init(){
      clearRecentBtn.addEventListener('click', function(){ save(load().filter(function(x){ return x.pinned; })); render(); });
      render();
    }
    return { init:init, add:add, render:render, all:all };
  })();

  /* ----------------------------------------------------------------- *
   *  Trending module — placeholder static list. Swap `TRENDING` for a
   *  fetch() to your own trending-searches endpoint when one exists.
   * ----------------------------------------------------------------- */
  NerdzEx.Trending = (function(){
    var TRENDING = ['AI search assistants', 'weather this weekend', 'unit converter', 'JSON formatter online', 'password generator'];
    function render(){
      var wrap = $('trending');
      wrap.innerHTML = '';
      TRENDING.forEach(function(t){
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'trend-chip';
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 6l-9.5 9.5-5-5L1 18"></path><path d="M17 6h6v6"></path></svg><span></span>';
        btn.querySelector('span').textContent = t;
        btn.addEventListener('click', function(){ $('searchInput').value = t; NerdzEx.Search.run(t); });
        wrap.appendChild(btn);
      });
    }
    return { render:render, list: function(){ return TRENDING; } };
  })();

  /* ----------------------------------------------------------------- *
   *  QuickAnswers module — deterministic, local, no AI needed.
   *  Handles math, unit conversion, date/time, definitions (free
   *  keyless dictionary API), and weather (free keyless Open-Meteo API).
   * ----------------------------------------------------------------- */
  NerdzEx.QuickAnswers = (function(){

    // --- tiny safe math evaluator (no eval/Function) ---
    function evalMath(expr){
      var tokens = expr.match(/(\d+\.?\d*|\.\d+|\+|\-|\*|\/|\^|\(|\)|sqrt|sin|cos|tan|log|abs|pi|e)/gi);
      if(!tokens) return null;
      var pos = 0;
      function peek(){ return tokens[pos]; }
      function next(){ return tokens[pos++]; }
      function parseExpr(){
        var v = parseTerm();
        while(peek() === '+' || peek() === '-'){
          var op = next(); var rhs = parseTerm();
          v = op === '+' ? v + rhs : v - rhs;
        }
        return v;
      }
      function parseTerm(){
        var v = parseFactor();
        while(peek() === '*' || peek() === '/'){
          var op = next(); var rhs = parseFactor();
          v = op === '*' ? v * rhs : v / rhs;
        }
        return v;
      }
      function parseFactor(){ return parsePow(); }
      function parsePow(){
        var v = parseUnary();
        if(peek() === '^'){ next(); var rhs = parsePow(); v = Math.pow(v, rhs); }
        return v;
      }
      function parseUnary(){
        if(peek() === '-'){ next(); return -parseUnary(); }
        return parseAtom();
      }
      function parseAtom(){
        var t = next();
        if(t === undefined) throw new Error('unexpected end');
        if(t === '('){ var v = parseExpr(); if(peek() === ')') next(); return v; }
        var fnMap = {sqrt:Math.sqrt, sin:Math.sin, cos:Math.cos, tan:Math.tan, log:Math.log10, abs:Math.abs};
        if(fnMap[t.toLowerCase()]){
          if(peek() === '(') next();
          var arg = parseExpr();
          if(peek() === ')') next();
          return fnMap[t.toLowerCase()](arg);
        }
        if(t.toLowerCase() === 'pi') return Math.PI;
        if(t.toLowerCase() === 'e') return Math.E;
        var n = parseFloat(t);
        if(isNaN(n)) throw new Error('bad token ' + t);
        return n;
      }
      try{
        var result = parseExpr();
        return isFinite(result) ? result : null;
      }catch(e){ return null; }
    }

    function looksLikeMath(q){
      return /^[\d\s\.\+\-\*\/\^\(\)a-z]+$/i.test(q) && /\d/.test(q) && /[\+\-\*\/\^]|sqrt|sin|cos|tan|log/i.test(q);
    }

    // --- unit conversion ---
    var LENGTH = { m:1, km:1000, cm:0.01, mm:0.001, mile:1609.34, mi:1609.34, yard:0.9144, yd:0.9144, foot:0.3048, feet:0.3048, ft:0.3048, inch:0.0254, in:0.0254 };
    var WEIGHT = { kg:1, g:0.001, mg:0.000001, lb:0.453592, lbs:0.453592, oz:0.0283495 };
    function convertTemp(v, from, to){
      var c;
      if(from === 'c') c = v; else if(from === 'f') c = (v-32)*5/9; else c = v-273.15;
      if(to === 'c') return c; if(to === 'f') return c*9/5+32; return c+273.15;
    }
    function tryUnitConvert(q){
      var m = q.match(/^([\d.]+)\s*([a-z]+)\s*(?:to|in)\s*([a-z]+)$/i);
      if(!m) return null;
      var val = parseFloat(m[1]); var from = m[2].toLowerCase(); var to = m[3].toLowerCase();
      var tempUnits = {c:'c', celsius:'c', f:'f', fahrenheit:'f', k:'k', kelvin:'k'};
      if(tempUnits[from] && tempUnits[to]){
        var r = convertTemp(val, tempUnits[from], tempUnits[to]);
        return { label: val + ' ' + m[2] + ' to ' + m[3], value: r.toFixed(2) + '°' + tempUnits[to].toUpperCase() };
      }
      if(LENGTH[from] && LENGTH[to]){
        var r2 = val * LENGTH[from] / LENGTH[to];
        return { label: val + ' ' + m[2] + ' to ' + m[3], value: (Math.round(r2*10000)/10000) + ' ' + m[3] };
      }
      if(WEIGHT[from] && WEIGHT[to]){
        var r3 = val * WEIGHT[from] / WEIGHT[to];
        return { label: val + ' ' + m[2] + ' to ' + m[3], value: (Math.round(r3*10000)/10000) + ' ' + m[3] };
      }
      return null;
    }

    function tryDateTime(q){
      var lower = q.toLowerCase().trim();
      if(/^(what('s| is) the )?time$/.test(lower) || lower === 'time now'){
        return { label:'Current time', value: new Date().toLocaleTimeString() };
      }
      if(/^(what('s| is) the )?date$|today'?s date/.test(lower)){
        return { label:'Today', value: new Date().toLocaleDateString(undefined, {weekday:'long', year:'numeric', month:'long', day:'numeric'}) };
      }
      return null;
    }

    function renderCard(html){
      var card = $('qaCard');
      card.innerHTML = html;
      card.classList.remove('hidden');
    }
    function renderLoading(label){
      renderCard('<div class="qa-value">…</div><div class="qa-label">' + escapeHtml(label) + '</div>');
    }
    function clear(){ $('qaCard').classList.add('hidden'); $('qaCard').innerHTML = ''; }

    // free, keyless dictionary API
    function tryDefine(q){
      var m = q.match(/^define\s+(.+)$/i) || q.match(/^(.+)\s+definition$/i);
      if(!m) return false;
      var word = m[1].trim();
      renderLoading('Definition');
      fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(data){
          if(!data){ clear(); return; }
          var def = data[0] && data[0].meanings && data[0].meanings[0] && data[0].meanings[0].definitions[0];
          if(!def){ clear(); return; }
          renderCard('<div class="qa-value">' + escapeHtml(word) + '</div><div class="qa-label">' + escapeHtml(data[0].meanings[0].partOfSpeech || '') + '</div><div class="qa-detail">' + escapeHtml(def.definition) + '</div>');
        }).catch(function(){ clear(); });
      return true;
    }

    // free, keyless weather via Open-Meteo (geocoding + forecast)
    function tryWeather(q){
      var m = q.match(/^weather\s+(?:in\s+)?(.+)$/i);
      if(!m) return false;
      var city = m[1].trim();
      renderLoading('Weather');
      fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(city))
        .then(function(r){ return r.json(); })
        .then(function(geo){
          var place = geo.results && geo.results[0];
          if(!place){ clear(); return; }
          return fetch('https://api.open-meteo.com/v1/forecast?latitude=' + place.latitude + '&longitude=' + place.longitude + '&current_weather=true')
            .then(function(r){ return r.json(); })
            .then(function(data){
              var cw = data.current_weather;
              if(!cw){ clear(); return; }
              renderCard('<div class="qa-value">' + Math.round(cw.temperature) + '°C</div><div class="qa-label">' + escapeHtml(place.name) + (place.country ? ', ' + escapeHtml(place.country) : '') + '</div><div class="qa-detail">Wind ' + cw.windspeed + ' km/h</div>');
            });
        }).catch(function(){ clear(); });
      return true;
    }

    // returns true if it handled (or started handling) the query
    function handle(q){
      clear();
      var trimmed = q.trim();
      if(!trimmed) return false;

      var dt = tryDateTime(trimmed);
      if(dt){ renderCard('<div class="qa-value">' + escapeHtml(dt.value) + '</div><div class="qa-label">' + escapeHtml(dt.label) + '</div>'); return true; }

      var uc = tryUnitConvert(trimmed);
      if(uc){ renderCard('<div class="qa-value">' + escapeHtml(uc.value) + '</div><div class="qa-label">' + escapeHtml(uc.label) + '</div>'); return true; }

      if(looksLikeMath(trimmed)){
        var res = evalMath(trimmed);
        if(res !== null){ renderCard('<div class="qa-value">' + (Math.round(res*10000)/10000) + '</div><div class="qa-label">' + escapeHtml(trimmed) + '</div>'); return true; }
      }

      if(tryWeather(trimmed)) return true;
      if(tryDefine(trimmed)) return true;

      return false;
    }

    return { handle:handle, clear:clear, evalMath:evalMath };
  })();

  /* ----------------------------------------------------------------- *
   *  AI module — STUBBED. No API key lives in this file. Swap
   *  `fetchSummary` for a real call to your Netlify Function
   *  (see groq-search.js) once it's deployed.
   * ----------------------------------------------------------------- */
  NerdzEx.AI = (function(){
    function showLoading(){
      var card = $('aiCard');
      card.classList.remove('hidden');
      $('aiCardBody').innerHTML = '<div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div>';
      $('aiCardBody').classList.remove('clamped');
      $('aiCardMore').classList.add('hidden');
    }
    function showSummary(text){
      var body = $('aiCardBody');
      body.textContent = text;
      body.classList.add('clamped');
      $('aiCardMore').classList.remove('hidden');

  /* ----------------------------------------------------------------- *
   *  Autocomplete module — Google suggest (JSONP) + recent/trending
   * ----------------------------------------------------------------- */
  NerdzEx.Autocomplete = (function(){
    var list = $('autocompleteList');
    var input = $('searchInput');
    var debounceTimer = null;
    var activeIndex = -1;
    var jsonpCounter = 0;

    function localSuggestions(q){
      var lower = q.toLowerCase();
      var fromHistory = NerdzEx.History.all().map(function(x){ return x.q; });
      var fromTrending = NerdzEx.Trending.list();
      var combined = fromHistory.concat(fromTrending);
      var seen = {};
      return combined.filter(function(s){
        var key = s.toLowerCase();
        if(seen[key] || key.indexOf(lower) === -1) return false;
        seen[key] = true; return true;
      }).slice(0, 5);
    }

    function googleSuggest(q, cb){
      var cbName = 'nerdzexSuggestCb' + (jsonpCounter++);
      var script = document.createElement('script');
      var timeout = setTimeout(function(){ cleanup(); cb([]); }, 2500);
      function cleanup(){
        clearTimeout(timeout);
        delete window[cbName];
        if(script.parentNode) script.parentNode.removeChild(script);
      }
      window[cbName] = function(data){
        cleanup();
        cb((data && data[1]) ? data[1].slice(0,6) : []);
      };
      script.onerror = function(){ cleanup(); cb([]); };
      script.src = 'https://suggestqueries.google.com/complete/search?client=chrome&q=' + encodeURIComponent(q) + '&jsonp=' + cbName;
      document.body.appendChild(script);
    }

    function render(suggestions){
      list.innerHTML = '';
      activeIndex = -1;
      if(suggestions.length === 0){ close(); return; }
      suggestions.forEach(function(s){
        var li = document.createElement('li');
        li.className = 'ac-item'; li.setAttribute('role','option');
        li.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><span></span>';
        li.querySelector('span').textContent = s;
        li.addEventListener('click', function(){ input.value = s; close(); NerdzEx.Search.run(s); });
        list.appendChild(li);
      });
      list.classList.remove('hidden');
      input.setAttribute('aria-expanded','true');
      document.getElementById('searchForm').classList.add('expanded');
    }

    function close(){
      list.classList.add('hidden'); list.innerHTML = '';
      input.setAttribute('aria-expanded','false');
      document.getElementById('searchForm').classList.remove('expanded');
    }

    function onInput(){
      var q = input.value.trim();
      clearTimeout(debounceTimer);
      if(!q){ close(); return; }
      var local = localSuggestions(q);
      render(local);
      debounceTimer = setTimeout(function(){
        googleSuggest(q, function(remote){
          var merged = local.concat(remote.filter(function(r){ return local.indexOf(r) === -1; }));
          render(merged.slice(0,7));
        });
      }, 180);
    }

    function onKeydown(e){
      var items = list.querySelectorAll('.ac-item');
      if(list.classList.contains('hidden') || items.length === 0) return;
      if(e.key === 'ArrowDown'){ e.preventDefault(); activeIndex = Math.min(activeIndex+1, items.length-1); highlight(items); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); activeIndex = Math.max(activeIndex-1, 0); highlight(items); }
      else if(e.key === 'Enter' && activeIndex >= 0){ e.preventDefault(); items[activeIndex].click(); }
      else if(e.key === 'Escape'){ close(); }
    }
    function highlight(items){
      items.forEach(function(it,i){ it.classList.toggle('active', i === activeIndex); });
      if(activeIndex >= 0) input.value = items[activeIndex].querySelector('span').textContent;
    }

    function init(){
      input.addEventListener('input', onInput);
      input.addEventListener('keydown', onKeydown);
      document.addEventListener('click', function(e){
        if(!e.target.closest('.search-wrap')) close();
      });
    }
    return { init:init, close:close };
  })();

  /* ----------------------------------------------------------------- *
   *  Search module — drives the real Google CSE results element,
   *  plus AI summary + quick answers, kept in sync with one query.
   * ----------------------------------------------------------------- */
  NerdzEx.Search = (function(){
    var cseReady = false;
    var cseElement = null;
    var pendingQuery = null;

    function onCseReady(){
      cseReady = true;
      if(window.google && google.search && google.search.cse && google.search.cse.element){
        google.search.cse.element.render({ div: 'gcse-searchresults-only0', tag:'searchresults-only' });
        cseElement = google.search.cse.element.getElement('searchresults-only0');
      }
      if(pendingQuery) run(pendingQuery);
    }

    function run(query){
      query = (query || '').trim();
      if(!query) return;

      NerdzEx.Autocomplete.close();
      NerdzEx.History.add(query);
      NerdzEx.QuickAnswers.handle(query);
      NerdzEx.AI.run(query);

      var resultsWrap = $('resultsWrap');
      resultsWrap.classList.remove('hidden');

      if(cseReady && cseElement){
        cseElement.execute(query);
      } else {
        pendingQuery = query; // will run once google.cse.js finishes loading
      }
    }

    function init(){
      var searchDiv = document.querySelector('.gcse-search');
      searchDiv.id = 'gcse-searchresults-only0';

      $('searchForm').addEventListener('submit', function(e){
        e.preventDefault();
        run($('searchInput').value);
      });
    }
    return { init:init, run:run, onCseReady:onCseReady };
  })();

  /* ----------------------------------------------------------------- *
   *  Mini Apps module — registry pattern. To add a new app later,
   *  push one object into APPS with id/name/icon/render.
   * ----------------------------------------------------------------- */
  NerdzEx.MiniApps = (function(){
    var STORAGE_FAV = 'nerdzex:apps:favorites';
    var STORAGE_RECENT_APPS = 'nerdzex:apps:recent';
    var body = $('miniAppsBody');

    function beep(freq, duration){
      try{
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        osc.frequency.value = freq || 880;
        osc.connect(ctx.destination);
        osc.start(); setTimeout(function(){ osc.stop(); ctx.close(); }, duration || 300);
      }catch(e){}
    }
    function copyToClipboard(text){
      if(navigator.clipboard) navigator.clipboard.writeText(text).catch(function(){});
    }

    var APPS = [
      { id:'calculator', name:'Calculator', icon:'🧮', render:renderCalculator },
      { id:'unit-converter', name:'Unit Converter', icon:'📐', render:renderUnitConverter },
      { id:'timer', name:'Timer', icon:'⏲️', render:renderTimer },
      { id:'stopwatch', name:'Stopwatch', icon:'⏱️', render:renderStopwatch },
      { id:'password', name:'Password Generator', icon:'🔐', render:renderPassword },
      { id:'qr', name:'QR Generator', icon:'📱', render:renderQr },
      { id:'dice', name:'Dice & Coin', icon:'🎲', render:renderDice }
      // more apps (weather, currency, notes, to-do, calendar, world clock,
      // QR scanner, color picker, text tools, JSON formatter, base64,
      // URL encoder, random number) can be registered here later —
      // each just needs { id, name, icon, render(container, ctx) }.
    ];

    function loadSet(key){
      try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
    }
    function saveSet(key, arr){ try{ localStorage.setItem(key, JSON.stringify(arr)); }catch(e){} }

    function toggleFavorite(id){
      var favs = loadSet(STORAGE_FAV);
      var idx = favs.indexOf(id);
      if(idx === -1) favs.unshift(id); else favs.splice(idx,1);
      saveSet(STORAGE_FAV, favs);
    }
    function markRecentApp(id){
      var recent = loadSet(STORAGE_RECENT_APPS).filter(function(x){ return x !== id; });
      recent.unshift(id);
      saveSet(STORAGE_RECENT_APPS, recent.slice(0,6));
    }

    function tile(app){
      var favs = loadSet(STORAGE_FAV);
      var isFav = favs.indexOf(app.id) !== -1;
      var el = document.createElement('button');
      el.type = 'button'; el.className = 'app-tile';
      el.innerHTML = '<span class="app-fav' + (isFav?' favorited':'') + '" role="presentation"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 5.5L20 9l-4 3.6L17 19l-5-3-5 3 1-6.4L4 9l5.6-1.5z"></path></svg></span><span class="app-icon">' + app.icon + '</span><span class="app-name"></span>';
      el.querySelector('.app-name').textContent = app.name;
      el.querySelector('.app-fav').addEventListener('click', function(e){
        e.stopPropagation(); toggleFavorite(app.id); renderHome();
      });
      el.addEventListener('click', function(){ markRecentApp(app.id); openApp(app); });
      return el;
    }

    function renderHome(){
      body.innerHTML = '';

      var searchWrap = document.createElement('div');
      searchWrap.className = 'app-search';
      searchWrap.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input type="text" placeholder="Search mini apps" aria-label="Search mini apps" />';
      body.appendChild(searchWrap);

      var favSection = document.createElement('div');
      var recentSection = document.createElement('div');
      var allSection = document.createElement('div');
      body.appendChild(favSection); body.appendChild(recentSection); body.appendChild(allSection);

      function draw(filter){
        var favIds = loadSet(STORAGE_FAV);
        var recentIds = loadSet(STORAGE_RECENT_APPS);
        var q = (filter||'').toLowerCase();
        var matches = function(a){ return a.name.toLowerCase().indexOf(q) !== -1; };

        favSection.innerHTML = ''; recentSection.innerHTML = ''; allSection.innerHTML = '';

        var favApps = APPS.filter(function(a){ return favIds.indexOf(a.id) !== -1 && matches(a); });
        if(favApps.length){
          var favLabel = document.createElement('div'); favLabel.className='app-section-label'; favLabel.textContent='Favorites';
          var favGrid = document.createElement('div'); favGrid.className='app-grid';
          favApps.forEach(function(a){ favGrid.appendChild(tile(a)); });
          favSection.appendChild(favLabel); favSection.appendChild(favGrid);
        }

        var recentApps = recentIds.map(function(id){ return APPS.find(function(a){ return a.id===id; }); }).filter(Boolean).filter(matches);
        if(recentApps.length){
          var recLabel = document.createElement('div'); recLabel.className='app-section-label'; recLabel.textContent='Recent';
          var recGrid = document.createElement('div'); recGrid.className='app-grid';
          recentApps.forEach(function(a){ recGrid.appendChild(tile(a)); });
          recentSection.appendChild(recLabel); recentSection.appendChild(recGrid);
        }

        var allApps = APPS.filter(matches);
        var allLabel = document.createElement('div'); allLabel.className='app-section-label'; allLabel.textContent='All Apps';
        allSection.appendChild(allLabel);
        if(allApps.length === 0){
          var empty = document.createElement('div'); empty.className='app-empty'; empty.textContent='No apps match "' + filter + '".';
          allSection.appendChild(empty);
        } else {
          var allGrid = document.createElement('div'); allGrid.className='app-grid';
          allApps.forEach(function(a){ allGrid.appendChild(tile(a)); });
          allSection.appendChild(allGrid);
        }
      }

      draw('');
      searchWrap.querySelector('input').addEventListener('input', function(){ draw(this.value); });
    }

    function openApp(app){
      body.innerHTML = '';
      var back = document.createElement('button');
      back.type = 'button'; back.className = 'app-view-back';
      back.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg><span>All apps</span>';
      back.addEventListener('click', renderHome);

      var container = document.createElement('div');
      container.className = 'app-view';
      container.appendChild(back);
      body.appendChild(container);

      var appBody = document.createElement('div');
      container.appendChild(appBody);
      app.render(appBody, { beep:beep, copyToClipboard:copyToClipboard });
    }

    /* ---- individual mini apps ---- */

    function renderCalculator(el){
      el.innerHTML =
        '<div class="calc-display" id="calcDisplay">0</div>' +
        '<div class="calc-grid" id="calcGrid"></div>';
      var display = el.querySelector('#calcDisplay');
      var grid = el.querySelector('#calcGrid');
      var expr = '';
      var keys = ['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'];
      keys.forEach(function(k){
        var btn = document.createElement('button');
        btn.type='button'; btn.className='calc-key' + (['/','*','-','+','='].indexOf(k)!==-1?' op':'');
        btn.textContent = k;
        btn.addEventListener('click', function(){
          if(k === 'C'){ expr = ''; }
          else if(k === '='){
            var res = NerdzEx.QuickAnswers.evalMath(expr);
            expr = res === null ? 'Error' : String(Math.round(res*100000)/100000);
          } else { expr += k; }
          display.textContent = expr || '0';
        });
        grid.appendChild(btn);
      });
    }

    function renderUnitConverter(el){
      el.innerHTML =
        '<div class="app-field"><label for="ucCategory">Category</label><select id="ucCategory"><option value="length">Length</option><option value="weight">Weight</option><option value="temp">Temperature</option></select></div>' +
        '<div class="app-row">' +
          '<div class="app-field"><label for="ucValue">Value</label><input id="ucValue" type="number" value="1" /></div>' +
          '<div class="app-field"><label for="ucFrom">From</label><select id="ucFrom"></select></div>' +
          '<div class="app-field"><label for="ucTo">To</label><select id="ucTo"></select></div>' +
        '</div>' +
        '<div class="app-output" id="ucOutput">—</div>';
      var units = {
        length:['m','km','cm','mm','mile','yard','foot','inch'],
        weight:['kg','g','mg','lb','oz'],
        temp:['c','f','k']
      };
      var cat = el.querySelector('#ucCategory');
      var from = el.querySelector('#ucFrom');
      var to = el.querySelector('#ucTo');
      var val = el.querySelector('#ucValue');
      var out = el.querySelector('#ucOutput');

      function fillUnits(){
        var list = units[cat.value];
        from.innerHTML = list.map(function(u){ return '<option value="'+u+'">'+u+'</option>'; }).join('');
        to.innerHTML = from.innerHTML;
        to.selectedIndex = Math.min(1, list.length-1);
        update();
      }
      function update(){
        var LENGTH = { m:1, km:1000, cm:0.01, mm:0.001, mile:1609.34, yard:0.9144, foot:0.3048, inch:0.0254 };
        var WEIGHT = { kg:1, g:0.001, mg:0.000001, lb:0.453592, oz:0.0283495 };
        var f = from.value, t = to.value, v = parseFloat(val.value) || 0, conv;
        if(cat.value === 'temp'){
          var c = f==='c'?v:(f==='f'?(v-32)*5/9:v-273.15);
          conv = t==='c'?c:(t==='f'?c*9/5+32:c+273.15);
        } else {
          var table = cat.value === 'length' ? LENGTH : WEIGHT;
          conv = v * table[f] / table[t];
        }
        out.textContent = (Math.round(conv*10000)/10000) + ' ' + to.value;
      }
      cat.addEventListener('change', fillUnits);
      [from, to, val].forEach(function(elm){ elm.addEventListener('input', update); elm.addEventListener('change', update); });
      fillUnits();
    }

      function refreshFromInputs(){
        remaining = (parseInt(el.querySelector('#tMin').value||0,10)*60) + parseInt(el.querySelector('#tSec').value||0,10);

    function renderStopwatch(el){

      el.querySelector('#pwLen').addEventListener('input', function(){ el.querySelector('#pwLenVal').textContent = this.value; });
      el.querySelector('#pwGen').addEventListener('click', generate);

    function renderDice(el, ctx){
      el.innerHTML =
        '<div class="dice-face" id="diceFace">🎲</div>' +
        '<div class="app-row"><button class="app-btn" id="diceRoll" type="button">Roll dice</button><button class="app-btn ghost" id="coinFlip" type="button">Flip coin</button></div>';
      var faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];

        ctx.beep(600,120);
      });
      el.querySelector('#coinFlip').addEventListener('click', function(){
        var result = Math.random() < 0.5 ? 'Heads' : 'Tails';
        el.querySelector('#diceFace').textContent = result === 'Heads' ? '🟡 Heads' : '⚪ Tails';
        ctx.beep(700,120);
      });
    }

    return { renderHome:renderHome };
  })();

  /* ----------------------------------------------------------------- *
   *  Init
   * ----------------------------------------------------------------- */
  document.addEventListener('DOMContentLoaded', function(){
    NerdzEx.Background.init();
    NerdzEx.Panels.init();
    NerdzEx.History.init();
    NerdzEx.Trending.render();
    NerdzEx.Autocomplete.init();
    NerdzEx.Search.init();
  });

})(window.NerdzEx);
</script>
</body>
</html>
